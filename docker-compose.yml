# docker compose up --build            -> printer + SNMP
# docker compose --profile multi up    -> also start a second printer
#
# Dashboard:  http://localhost:10080  (printer 1)   http://localhost:20080  (printer 2)

services:
  printer:
    build: .
    container_name: virtualprinter
    command: ["--name", "Virtual Printer"]
    ports:
      - "19100:19100"   # raw / JetDirect
      - "10515:10515"   # LPD
      - "10631:10631"   # IPP
      - "10080:10080"   # dashboard
    volumes:
      - printer_jobs:/jobs
      # - ./web:/app/web:ro   # uncomment to customize the dashboard (edit ./web, refresh the browser)
    restart: unless-stopped

  snmp:
    build:
      context: .
      dockerfile: Dockerfile.snmp
    container_name: virtualprinter-snmp
    ports:
      - "10161:10161/udp"
    restart: unless-stopped

  # Second printer on shifted ports (offset 20000), starting in the paper-out state.
  printer2:
    profiles: ["multi"]
    build: .
    container_name: virtualprinter2
    command: ["--offset", "20000", "--name", "Virtual Receipt Printer", "--state", "paperout"]
    ports:
      - "29100:29100"
      - "20515:20515"
      - "20631:20631"
      - "20080:20080"
    volumes:
      - printer2_jobs:/jobs
    restart: unless-stopped

# Named volumes: managed by Docker, survive `docker compose down` and rebuilds.
# (`docker compose down -v` deletes them.)
volumes:
  printer_jobs:
  printer2_jobs: