# docker compose up --build            -> printer + SNMP
# docker compose --profile multi up    -> also start a second printer
#
# Dashboard:  http://localhost:8080  (printer 1)   http://localhost:10080  (printer 2)

services:
  printer:
    build: .
    container_name: virtualprinter
    command: ["--name", "Virtual Printer"]
    ports:
      - "9100:9100"   # raw / JetDirect
      - "515:515"     # LPD
      - "631:631"     # IPP
      - "8080:80"     # dashboard
    volumes:
      - printer_jobs:/jobs
    restart: unless-stopped

  snmp:
    build:
      context: .
      dockerfile: Dockerfile.snmp
    container_name: virtualprinter-snmp
    ports:
      - "161:161/udp"
    restart: unless-stopped

  # Second printer on shifted ports (offset 10000), starting in the paper-out state.
  printer2:
    profiles: ["multi"]
    build: .
    container_name: virtualprinter2
    command: ["--offset", "10000", "--name", "Virtual Receipt Printer", "--state", "paperout"]
    ports:
      - "19100:19100"
      - "10515:10515"
      - "10631:10631"
      - "10080:10080"
    volumes:
      - printer2_jobs:/jobs
    restart: unless-stopped

# Named volumes: managed by Docker, survive `docker compose down` and rebuilds.
# (`docker compose down -v` deletes them.)
volumes:
  printer_jobs:
  printer2_jobs: