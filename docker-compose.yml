services:
  virtualprinter:
    build: .
    image: virtualprinter:latest
    container_name: virtualprinter
    restart: unless-stopped
    ports:
      - "9100:9100"   # raw / JetDirect
      - "515:515"     # LPD
      - "631:631"     # IPP  (change the left side if the host already runs CUPS)
      - "8080:80"     # dashboard -> http://localhost:8080/
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0   # lets the non-root user bind 80/515/631
    volumes:
      - jobs:/jobs
    # extra options go here, e.g.:  command: ["--name", "Front Desk", "--state", "ok"]

volumes:
  jobs:
